# ?? Actuator / Prometheus ?????????????????????????????????????????????????
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ?? SpringDoc / Swagger UI ????????????????????????????????????????????????
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

# ?? Logging ???????????????????????????????????????????????????????????????
logging:
  level:
    root: INFO
    com.agriconnect: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.kafka: INFO

# ?? Topics Kafka (r�f�rence centralis�e) ?????????????????????????????????
kafka:
  topics:
    commande-creee: commande-creee
    commande-validee: commande-validee
    offre-publiee: offre-publiee
    message-envoye: message-envoye
    notification: notification
agriconnect:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min-aaaa}      # variable d'environnement, 32 caractères minimum, jamais dans le dépôt
    expiration: 1h
    issuer: agriconnect
  cors:
    allowed-origins: http://localhost:4200
  paiement:
    frontend-url: http://localhost:4200              # pages de retour du paiement
    url-publique-serveur: https://votre-domaine.sn   # joignable par les prestataires (webhooks) ; en local : un tunnel (ngrok...)
    simulation-active: true                          # ⚠️ true UNIQUEMENT en développement
    wave:
      actif: true
      mode: simulation                               # simulation | reel
      base-url: https://api.wave.com
      cle: ${WAVE_API_KEY:}                          # clé API Wave Business
      secret-webhook: ${WAVE_WEBHOOK_SECRET:}        # secret de signature des webhooks
    orange:
      actif: true
      mode: simulation                               # tant que l'intégration réelle n'est pas faite
      base-url: ${ORANGE_BASE_URL:}
      cle: ${ORANGE_CLE:}
      secret-webhook: ${ORANGE_SECRET:}
  fichiers:
    dossier: ./uploads                    # en production : un volume persistant (ou un stockage objet)
    taille-max-octets: 5242880            # 5 Mo
  marche:
    avis-reserves-aux-acheteurs: true
    taille-page-max: 50
  boost:
    prix: 5000            # FCFA par boost ; 0 = inclus dans l'abonnement, sans paiement
    duree-jours: 30
    premium-requis: true  # true : il faut un abonnement payant en cours pour acheter un boost
